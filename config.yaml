# ---------------------------------------------------------------------------
# Caravan Sanat crawler — settings. Secrets (API keys) go in .env, not here.
# ---------------------------------------------------------------------------
data_dir: data
sources_file: sources.yaml

taxonomy:
  file: data/taxonomy.csv          # copy taxonomy-test01-merged.csv here
  exclude_level1:
    - برندها و خطوط محصول

# Route per category: iran | foreign | both.
# Priority: a "Route" column in the taxonomy file > by_id > the longest
# matching breadcrumb prefix > default. A rule on a parent is inherited by
# every leaf under it, so only exceptions need writing.
routes:
  default: iran
  by_path_prefix:
    "شیرآلات > اکچویتور برقی و محرک شیر": both
    "تجهیزات تابلو برق و برق صنعتی > درایو و اینورتر موتور": both
    "بذر": iran
    "کود و نهاده‌های کشاورزی و دامی": iran
  by_id: {}

routing:
  iran_min_priced: 3               # >= this many Iranian shops with a price -> Iranian sources
  foreign_max_shops: 1             # <= this many Iranian shops -> Made-in-China
  probe_rule_groups: true          # also search branded groups, to discover shops
  discovered_per_group: 10         # shops from a group's search used as crawl sources
  shared_shops: 6                  # plus shops found for sibling groups under the same parent
  brand_probe: true                # brand categories: one more search with the brand name
  batch_size: 100

search:
  max_hits_per_source: 12           # per Iranian shop and category
  synonyms_max: 2                  # extra shop searches with the taxonomy's synonyms
  topup_below: 5                   # after the filter: categories under N products get an exact web search
  topup_max: 80                    # at most this many such categories per run
  topup_workers: 4                 # categories topped up at the same time
  topup_shops_max: 25              # empty category: at most this many known shops searched (those selling in its area first)
  torob_directory: false           # Torob as a shop directory: off — from the server its API does not answer,
                                   # product pages return 490 and /search/ is disallowed by robots.txt
  foreign_candidates: 40           # Made-in-China candidates per category (best ones kept later)
  per_supplier: 2                  # at most this many products from one Chinese supplier
  listing_max: 12                  # products opened from one shop category page
  listing_pages: 3                 # and the list's next pages, up to this many

select:
  max_per_category: 24             # keep the best N products per category (quality score), 0 = all
  max_per_seller: 3                # inside those N, at most this many from one seller (if others exist)
  use_web_search: false            # true = also search the whole web (needs SERPER_API_KEY)

http:
  delay_seconds: 2                 # wait between two requests to the same site
  domain_delays:                   # per-site exceptions (all subdomains of the site share it)
    made-in-china.com: 1
  workers: 10                      # sites fetched in parallel (each still at its own pace)
  parse_slots: 3                   # pages parsed at the same time (memory)
  timeout_seconds: 15
  retries: 1
  dead_after_failures: 4           # a site failing 4 times in a row is skipped for the rest of the run
  cache_days: 14                   # reruns within this window reuse saved pages
  respect_robots: true
  user_agent: "CaravanSanatBot/0.1 (+https://caravansanat.com)"
  proxy:                           # optional, e.g. a VPN's local proxy
    iran: null                     # Iranian sites: usually direct (no VPN)
    foreign: null                  # e.g. "http://127.0.0.1:10809" for Claude API / Made-in-China

fx:
  provider: manual                 # manual | json_api
  manual_rate_toman: null          # <- REQUIRED for manual: today's dollar rate in toman
  rate_type: free                  # free | nima — stored next to every price
  # json_api example (your existing dollar API):
  # provider: json_api
  # url: "https://example.com/api/latest?key={FX_API_KEY}"
  # json_path: "usd_sell.value"     # where the number is inside the JSON
  # unit: toman                     # toman | rial
  sanity_range_toman: [10000, 10000000]

price:
  default_unit: toman              # used only when a page gives no clue (flagged "unit_assumed")
  min_toman: 5000                  # below this -> flag too_low (excluded from the median)
  max_toman: 50000000000
  round_to_toman: 1000
  foreign_multiplier: 2            # Made-in-China price x this (shipping, customs, margin)
  estimate_missing: true           # no price -> same model elsewhere, same brand, careful category median
  serper_lookup: true              # same model in a web search (1 search each, capped below)
  serper_lookups_per_run: 60
  woo_lookups_per_run: 300
  outlier_factor: 6                # price < median/6 or > median*6 in its category -> dropped

llm:
  # rules             free rule-based filter, no model (default)
  # openai_compatible any OpenAI-style chat API: local Ollama or a hosted open-model service
  # anthropic         Claude API (only where Anthropic's service is available)
  provider: rules
  base_url: http://localhost:11434/v1   # Ollama default; for a hosted service put its /v1 URL
  model: qwen2.5:7b                     # e.g. qwen2.5:7b on Ollama
  api_key_env: LLM_API_KEY              # not needed for local Ollama
  batch_size: 15
  min_confidence: 0.6
  rules_min_confidence: 0.5
  max_tokens: 4000

dedupe:
  crawl_name_threshold: 0.9        # same product inside the crawl (by name, when no model number)
  same_threshold: 0.92             # >= this vs a site product -> "update existing"
  review_threshold: 0.8            # between the two -> review file

site_catalog:
  file: null                       # or pass --site-export at the dedupe step
  columns:                         # WooCommerce export headers, English or Persian
    id: [ID, شناسه]
    sku: [SKU, شناسه محصول]
    name: [Name, نام]
    price: [Regular price, قیمت عادی, قیمت]
    categories: [Categories, دسته‌ها, دسته ها]

export:
  published: 0                     # 0 = import as draft, check, then publish
  require_price: true

images:
  enabled: true
  per_product: 3          # photos per product
  size: 1000              # square, white background
  quality: 85             # WebP
  remove_background: true # busy backgrounds -> white (free U2-Net model on the server)
  search_max: 40          # products with no usable photo: image search (Serper) per run
  delay_seconds: 1        # between two photo downloads from one site (pages: http.delay_seconds)
  # public_base: https://caravan-crawler.onrender.com   # default: Render's own address

describe:
  provider: auto          # auto: OpenRouter when OPENROUTER_API_KEY is set, otherwise the free template
  model: deepseek/deepseek-v4.1-flash
  workers: 4              # products written at the same time
  max_tokens: 1400
